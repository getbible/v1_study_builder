# Add the relevant server block to each API virtual host. Set root to the
# checkout of getbible/commentaries or getbible/dictionaries respectively.
#
# The builder owns the v1/ directory of each checkout, so the public URL keeps an
# explicit version segment and a future v2/ can be served beside it unchanged.
#
# Generate the precompressed variants at deploy time rather than committing them;
# binary blobs delta poorly in Git and would grow both repositories every month:
#
#   find v1 -name '*.json' -exec brotli -kf {} \; -exec gzip -kf9 {} \;

server {
    listen 443 ssl;
    http2 on;
    server_name commentaries.getbible.net;
    root /var/www/getbible/commentaries;

    etag on;
    gzip on;
    gzip_types application/json;
    gzip_static on;
    # brotli_static on;   # requires ngx_brotli

    # Chapter, book, and whole-commentary documents change only when the source
    # module changes, so they are cached hard between monthly builds.
    location /v1/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # A regular expression location wins over the prefix above, so the three
    # discovery documents stay short-lived while everything else does not.
    location ~* ^/v1/(commentaries|build|hashes)\.json$ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
    }
}

# Duplicate the block for dictionaries.getbible.net and set:
#   root /var/www/getbible/dictionaries;
# and match (dictionaries|build|hashes)\.json for the discovery documents.
